# Paths are for Kaggle; copy this file and edit them for another machine.
raw_dir: /kaggle/input/competitions/h-and-m-personalized-fashion-recommendations
images_dir: /kaggle/input/competitions/h-and-m-personalized-fashion-recommendations/images
subset_path: data/processed/subset.parquet

seed: 42

# Non-fashion items are excluded: a look-alike search for clothes should not return toys.
# Groups come from product_group_name; individual types are listed when a group is mixed.
exclude_product_groups:
  [Unknown, Cosmetic, Items, Furniture, Garment and Shoe care, Stationery, Interior textile, Fun]
exclude_product_types: [Soft Toys] # review the printed type list after rerunning and extend

cap_per_type: 300 # chosen from the real distribution (105,542 articles, 131 types); target ~20k
min_per_type: 30 # types with fewer items cannot be split sensibly

# Near-duplicate check (embeddings come from frozen CLIP, Phase 2 extraction)
embeddings_path: artifacts/embeddings/clip/embeddings.npy
embedding_ids_path: artifacts/embeddings/clip/ids.npy
near_dup_threshold: 0.98 # swept 0.97-0.995 on real data, see DECISIONS.md D16
near_dup_pairs_path: data/processed/near_dup_pairs.parquet

# Splits (ids only, committed to the repo)
holdout_type_frac: 0.2
ratios: [0.7, 0.1, 0.2]
splits_path: splits/splits_v1.csv
