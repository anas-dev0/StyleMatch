[project]
name = "lookalike"
version = "0.1.0"
description = "Visual look-alike search for fashion items (CLIP embeddings, LoRA, Qdrant, rigorous evaluation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
# Heavy packages are kept out of the default install so CI stays fast.
tracking = ["mlflow>=2.16"]
# Preinstalled on Kaggle; declared here so exact versions are recorded in uv.lock.
ml = ["torch>=2.2", "transformers>=4.44", "pillow>=10"]
# Text-search app. torch/transformers are NOT here: the app runs in an environment that already has them.
app = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookalike"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # lets tests import the top-level `app` package
